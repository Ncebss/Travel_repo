<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Cachedflow Technology</title>
    <link rel="stylesheet" href="css/Styles.css"> <!-- ensure stylesheet is linked -->
</head>
<body>
    <header class="site-header">
        <!-- logo and nav unchanged, classes added for styling -->
        <img src="images/Cachedflow_logo.png" alt="Cachedflow Technology logo" width="450">
        <nav class="primary-nav">
            <a href="cachedflow.html">Home</a>
            <a href="features.html">Features</a>
            <a href="pricing.html">Pricing</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="container">
<!--adding a section for the question-->
        <section id="contact-intro">
            <h1>Get in touch</h1>
            <p>Have a question or ready to start? Send us a message and we'll get back to you.</p>
        </section>
<!--creating an input section for the contact form -->
        <section id="contact-form">
            <form>
                <!-- adding a name input-->
                <label for="name">Name</label><br>
                <input type="text" id="name" name="name" required><br><br>

                <!--adding an email input-->
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <!--adding a company input-->
                <label for="company">Company</label><br>
                <input type="text" id="company" name="company"><br><br>

                <label for="message">Message</label><br>
                <textarea id="message" name="message" rows="5" required></textarea><br><br>

                <button type="submit" class="cta-button">Send message</button>
            </form>
        </section>

<!--Adding the location of the website-->
        <section id="location">
            <h2>Find us</h2>
            <!--adding the link of the location-->
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d28673.752696740212!2d27.996408882659964!3d-26.059095438616563!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1e95747664310991%3A0xbeb533755a3527fd!2sBryanston%2C%20Sandton%2C%202191!5e0!3m2!1sen!2sza!4v1786538681698!5m2!1sen!2sza" 
                width="600" 
                height="450" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
</section>

    </main>

    <footer class="site-footer">
        <nav>
            <a href="about.html">About</a>
            <a href="pricing.html">Pricing</a>
            <a href="contact.html">Contact</a>
        </nav>
        <p>&copy; 2026 Cachedflow Technology Nceba Majola ST10537199. All rights reserved.</p>
    </footer>
</body>
</html>
